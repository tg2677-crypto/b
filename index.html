<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0E2418">
<title>야구팀 페이지</title>
<style>
:root{--bg:#F3F6F1;--surface:#fff;--ink:#14201A;--mute:#5E6E64;--line:#DCE4DB;--board:#0E2418;--amber:#F5B82E}
@media (prefers-color-scheme: dark){:root{--bg:#0B1510;--surface:#13221A;--ink:#EAF1EC;--mute:#93A59A;--line:#22362A;--board:#06100B}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;display:flex;flex-direction:column;justify-content:center;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px))}
main{width:100%;max-width:440px;margin:0 auto}
h1{font-size:26px;font-weight:900;margin:0 0 6px}
p{margin:0 0 24px;color:var(--mute)}
a{display:block;text-decoration:none;color:#EAF1EC;background:var(--board);border-radius:14px;padding:22px 20px;margin-bottom:12px;font-size:22px;font-weight:900}
a span{display:block;margin-top:4px;font-size:14px;font-weight:400;color:#9DB5A6}
a:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1>야구팀 페이지</h1>
  <p>우리 팀을 선택하세요</p>
  <a href="Garak/">가락불스<span>일정 · 라인업 · 팀원</span></a>
  <a href="charis/">카리스<span>일정 · 라인업 · 팀원</span></a>
  <a href="rattlers/">래틀러스<span>일정 · 라인업 · 팀원</span></a>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E2418">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OBP브라더스">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E⚾%3C/text%3E%3C/svg%3E">
<title>OBP브라더스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --crest:#C8262F; --hero2:#1F5A3A;
  --bg:#F3F6F1; --surface:#FFFFFF; --ink:#14201A; --mute:#5E6E64; --line:#DCE4DB;
  --board:#0E2418; --amber:#F5B82E;
  --win:#1F7A4D; --loss:#B3412E; --draw:#6B7A72;
  --chip-on:#1F5A3A; --chip-on-ink:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0B1510; --surface:#13221A; --ink:#EAF1EC; --mute:#93A59A; --line:#22362A;
    --board:#06100B; --win:#3FA06C; --loss:#D4604B; --draw:#7F8F86;
    --chip-on:#4FAE7C; --chip-on-ink:#06100B;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  line-height:1.5; padding-bottom:calc(72px + env(safe-area-inset-bottom,0px));
}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* 팀 로고·상단 배너 */
header{border-bottom:3px solid var(--crest,var(--amber))}
.hd-brand{display:flex;align-items:center;gap:10px;min-width:0}
.hd-logo{width:36px;height:36px;border-radius:50%;flex:none;background:#000;box-shadow:0 0 0 2px rgba(255,255,255,.22)}
.hero{position:relative;overflow:hidden;margin:12px 0 0;border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:12px;color:#EAF1EC;
  background:linear-gradient(135deg,#07130d 0%,var(--board) 45%,var(--hero2,#1F5A3A) 100%)}
.hero::after{content:"";position:absolute;right:-30px;top:-40px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.10),transparent 70%)}
.hero .lg{width:46px;height:46px;border-radius:50%;flex:none;background:#000;box-shadow:0 0 0 3px rgba(255,255,255,.28),0 6px 18px rgba(0,0,0,.45);display:grid;place-items:center;font-size:24px;overflow:hidden}
.hero .lg img{width:100%;height:100%;display:block}
.hero .tn{font-size:18px;font-weight:900;letter-spacing:-.02em;line-height:1.15}
.hero .tg{margin-top:1px;font-size:11px;display:inline;letter-spacing:.06em;font-weight:700;color:var(--amber);text-transform:uppercase}
.hero .ds{margin:0 0 0 6px;font-size:11px;color:#BFD0C5;display:inline}

.wx{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.14);font-size:14px;color:#DDE8E0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wx .ic{font-size:30px;line-height:1}
.wx b{font-size:18px;color:#fff}
.wx .sm{font-size:12px;color:#9DB5A6;width:100%}

/* 시상·전적·MVP·개인 페이지 */
.h2h{font-size:13px;margin-top:4px;color:#C9D8CE}
.card .h2h{color:var(--mute)}
.awgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
@media(max-width:380px){.awgrid{grid-template-columns:1fr}}
.aw{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.aw h3{margin:0;font-size:15px}
.aw small{display:block;color:var(--mute);font-size:11px;margin-bottom:6px}
.awr{display:flex;align-items:center;gap:6px;font-size:14px;padding:3px 0;font-variant-numeric:tabular-nums}
.awr .md{width:22px;text-align:center}
.awr .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.awr b{color:var(--chip-on)}

table.h2t{width:100%;border-collapse:collapse;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
table.h2t th,table.h2t td{padding:8px 10px;text-align:center;border-bottom:1px solid var(--line)}
table.h2t th:first-child,table.h2t td:first-child{text-align:left}
table.h2t th{font-size:12px;color:var(--mute)}
.mvp{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.mvp .mh{font-weight:700;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.mvp .mh span{font-weight:400;font-size:12px;color:var(--mute)}
.mvp .mchips{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.mvp button.mc{position:relative;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;cursor:pointer;overflow:hidden;display:flex;justify-content:space-between;gap:8px}
.mvp button.mc i{position:absolute;left:0;top:0;bottom:0;background:var(--chip-on);opacity:.16}
.mvp button.mc span{position:relative}
.mvp button.mc[aria-pressed=true]{border-color:var(--chip-on);box-shadow:0 0 0 1px var(--chip-on) inset;font-weight:700}
.mvp .who-row{margin-top:8px}
#pd{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center}
#pd.on{display:flex}
#pd .pd-sheet{background:var(--bg);color:var(--ink);width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px))}
#pd .pd-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
#pd .pd-top h2{margin:0;font-size:22px}
#pd .pd-x{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:36px;height:36px;font-size:16px;cursor:pointer;flex:none}
#pd h4{margin:18px 0 6px;font-size:14px}
.pdtiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.pdtiles div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center}
.pdtiles b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.pdtiles span{font-size:11px;color:var(--mute)}
.pdg{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.pdg span:first-child{color:var(--mute);flex:none}
svg.trend{width:100%;height:auto;display:block;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.member{cursor:pointer}

/* 길찾기 · 배지 · 비교 · 공유 카드 */
.maplinks{display:inline-flex;gap:6px;margin-left:6px;vertical-align:middle;flex-wrap:wrap}
.maplinks a{font-size:12px;font-weight:700;text-decoration:none;padding:2px 8px;border-radius:999px;border:1px solid currentColor;opacity:.9;color:inherit;white-space:nowrap}
.board .maplinks a{color:var(--amber)}
.callinks{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.callinks button,.callinks a{font-size:12px;font-weight:700;text-decoration:none;padding:5px 10px;border-radius:999px;border:1px solid currentColor;background:transparent;color:inherit;cursor:pointer;white-space:nowrap;font-family:inherit;line-height:1.3}
.board .callinks button,.board .callinks a{color:var(--amber)}
#calsheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
#calsheet.on{display:flex}
#calsheet .sheet{background:var(--surface);color:var(--ink);border-radius:16px;padding:20px 16px 16px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:10px}
#calsheet p{margin:0;font-size:17px;font-weight:700;text-align:center}
#calsheet .calhelp{font-size:14px;line-height:1.6}
#calsheet .calhelp.sm{font-size:12px;opacity:.75}
#calsheet .calgo{display:flex;align-items:center;justify-content:center;min-height:50px;border-radius:12px;background:var(--chip-on);color:var(--chip-on-ink);font-weight:700;font-size:16px;text-decoration:none}
#calsheet button{min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bdg{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center;position:relative}
.bdg .bi{font-size:26px;line-height:1.1}
.bdg .bn{font-size:12px;font-weight:700;margin-top:2px}
.bdg .bx{font-size:10px;color:var(--mute);line-height:1.3}
.bdg .bc{position:absolute;top:4px;right:6px;font-size:10px;font-weight:900;color:var(--chip-on)}
.bdg.off{opacity:.35;filter:grayscale(1)}
.bdg.off .bi{filter:grayscale(1)}
.cmpsel{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:15px}
.cmp-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;gap:6px;margin:14px 0 6px;font-weight:900;font-size:17px}
.cmp-head span{font-size:12px;color:var(--mute);font-weight:400}
.cmprow{display:grid;grid-template-columns:1fr 64px 1fr;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;font-size:14px}
.cmprow .l,.cmprow .r{display:flex;align-items:center;gap:6px}
.cmprow .l{justify-content:flex-end}
.cmprow .k{text-align:center;font-size:12px;color:var(--mute)}
.cmprow i{display:block;height:8px;border-radius:4px;background:var(--line)}
.cmprow .win{font-weight:900;color:var(--chip-on)}
.cmprow .win i{background:var(--chip-on)}
.cmp-score{text-align:center;margin:12px 0 0;font-weight:700}
.sharebtn{margin-top:10px;width:100%;padding:10px;border-radius:10px;border:1px solid var(--chip-on);background:var(--chip-on);color:var(--chip-on-ink);font-weight:700;cursor:pointer}

.mvp-fold{width:100%;display:flex;justify-content:space-between;gap:8px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:13px;cursor:pointer}
.mvp-fold b{color:var(--chip-on)}
.mvp-fold span:last-child{color:var(--mute);white-space:nowrap}

.hd-brand{cursor:pointer;-webkit-tap-highlight-color:transparent}
.hd-home{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:999px;border:1px solid #2F4A3A;color:#EAF1EC;flex:none}
.hd-brand:active .hd-home{background:rgba(255,255,255,.12)}

table.st tr.unq td{border-top:2px dashed var(--mute)}

.bdg .bp{height:4px;border-radius:2px;background:var(--line);margin:5px 8px 0;overflow:hidden}
.bdg .bp i{display:block;height:100%;background:var(--chip-on)}
.bdg.t1{border-color:#B87333;box-shadow:0 0 0 1px #B87333 inset}.bdg.t1 .bc{color:#B87333}
.bdg.t2{border-color:#9AA4AE;box-shadow:0 0 0 1px #9AA4AE inset}.bdg.t2 .bc{color:#7E8892}
.bdg.t3{border-color:#E0A800;box-shadow:0 0 0 2px #E0A800 inset;background:linear-gradient(160deg,rgba(245,184,46,.16),var(--surface))}.bdg.t3 .bc{color:#C99200}
.bdg.t4{border-color:#4FC3F7;box-shadow:0 0 0 2px #4FC3F7 inset;background:linear-gradient(160deg,rgba(79,195,247,.18),var(--surface))}.bdg.t4 .bc{color:#1E9BD7}
.mbadge{font-size:11px;font-weight:700;color:var(--chip-on);margin-left:6px}

/* 승부 예측 */
.pred h3{margin:0 0 4px;font-size:15px}
.pred .pr-row{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px 0}
.pred .pr-team{flex:1;text-align:center;font-size:13px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pred .pr-num{display:flex;align-items:center;gap:4px}
.pred .pr-num button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:18px;font-weight:700;cursor:pointer;color:var(--ink)}
.pred .pr-num b{width:34px;text-align:center;font-size:26px;font-variant-numeric:tabular-nums}
.pred .pr-colon{font-size:22px;font-weight:900;color:var(--mute)}
.pred .pr-save{width:100%;padding:11px;border-radius:10px;border:0;background:var(--chip-on);color:var(--chip-on-ink);font-weight:700;font-size:15px;cursor:pointer}
.pred .pr-dist{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:10px 0 4px;background:var(--line)}
.pred .pr-dist i{display:block;height:100%}
.pred .pr-legend{display:flex;justify-content:space-between;font-size:12px;color:var(--mute)}
.pred .pr-list{font-size:13px;margin-top:8px;line-height:1.7}
.pred .pr-list span{display:inline-block;margin-right:10px;white-space:nowrap}
.predres{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:13px}
.predres b{color:var(--chip-on)}

/* KBO 중계 스타일 라인업 */
.lu-wrap{display:grid;grid-template-columns:58% 1fr;gap:6px;align-items:stretch;margin-top:4px}
@media(min-width:560px){.lu-wrap{grid-template-columns:60% 1fr;gap:12px}}
.lu-wrap .field{margin:0;aspect-ratio:auto;height:100%;min-height:220px}
.lu-wrap > div[data-act=fbig-open]{height:100%}
.lu-wrap .fp{flex-direction:row;gap:0}
.lu-wrap .fo{min-width:13px;height:13px;font-size:8px;padding:0 2px;border-radius:4px 0 0 4px}
.lu-wrap .fn{font-size:9px;line-height:13px;padding:0 3px;border-radius:0 4px 4px 0;letter-spacing:-.03em}
@media(min-width:560px){.lu-wrap .fp{flex-direction:column;gap:2px}.lu-wrap .fo{min-width:20px;height:20px;font-size:11px;border-radius:999px}.lu-wrap .fn{font-size:11px;line-height:1.4;padding:1px 6px;border-radius:6px}}
.kbo{background:var(--board);color:#EAF1EC;border-radius:12px;overflow:hidden;font-variant-numeric:tabular-nums}
.kbo .kh{display:flex;justify-content:space-between;align-items:center;padding:7px 9px;background:linear-gradient(90deg,var(--crest,#C8262F),#7a1419);font-size:11px;font-weight:900;letter-spacing:.02em}
.kbo .kh span{font-weight:500;opacity:.85}
.kbo .kr{display:grid;grid-template-columns:14px 24px 1fr auto;align-items:center;gap:3px;padding:0 7px;height:27px;line-height:1.2;overflow:hidden;border-top:1px solid rgba(255,255,255,.07);font-size:12px}
.kbo .kr:nth-child(even){background:rgba(255,255,255,.04)}
.kbo .kr .o{color:var(--amber);font-weight:900;font-size:13px;text-align:center}
.kbo .kr .p{font-size:10px;color:#9DB5A6;text-align:center}
.kbo .kr .n{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.kbo .kr .n small{font-size:9px;font-weight:700;margin-left:3px;padding:0 3px;border-radius:3px;background:var(--loss);color:#fff;vertical-align:1px}
.kbo .kr .n small.m{background:var(--draw)}
.kbo .kr .a{font-size:11px;display:flex;align-items:center;gap:1px;color:#C9D8CE;text-align:right;white-space:nowrap}
.kbo .kr.mine,.kbo .kr.mine:nth-child(even){background:rgba(245,184,46,.22);box-shadow:inset 3px 0 0 var(--amber)}
.kbo .kr.mine .n{color:#fff}
.spcard{display:flex;align-items:center;gap:12px;margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.spcard .t{font-size:11px;font-weight:900;color:var(--surface);background:var(--crest,#C8262F);padding:3px 7px;border-radius:6px;white-space:nowrap}
.spcard .nm{font-weight:900;font-size:16px}
.spcard .st{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.lu-legend{font-size:11px;color:var(--mute);margin-top:6px}

/* 그라운드 크게 보기 (선수 카드) */
.lu-wrap .field{cursor:zoom-in}
.lu-zoom{position:absolute;right:6px;bottom:6px;font-size:10px;font-weight:700;color:#fff;background:rgba(6,16,11,.7);padding:2px 6px;border-radius:999px;pointer-events:none}
#fbig{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.72);display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px}
#fbig.on{display:flex}
#fbig .fld{position:relative;width:100%;max-width:460px;aspect-ratio:360/370;border-radius:16px;overflow:hidden;background:#163A27}
#fbig .fld svg{position:absolute;inset:0;width:100%;height:100%}
#fbig .cap{position:absolute;top:9px;left:12px;color:#fff;font-weight:900;font-size:13px;z-index:2;text-shadow:0 1px 3px rgba(0,0,0,.6)}
#fbig .x{position:absolute;top:7px;right:9px;z-index:3;color:#fff;font-size:14px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.5);border-radius:999px;width:30px;height:30px;cursor:pointer}
.pc{position:absolute;transform:translate(-50%,-50%);width:18.5%;min-width:60px;max-width:84px;border-radius:10px;background:linear-gradient(180deg,#fff,#E9EFEA);box-shadow:0 4px 10px rgba(0,0,0,.45);text-align:center;padding:16px 2px 4px;color:#14201A;animation:pcIn .35s ease both}
.pc .av{position:absolute;left:50%;top:-16px;transform:translateX(-50%);width:30px;height:30px;border-radius:50%;background:#0E2418;color:#F5B82E;font-weight:900;font-size:13px;display:grid;place-items:center;border:2px solid #fff;overflow:hidden}
.pc .av img{width:100%;height:100%;object-fit:cover}
.pc .od{position:absolute;left:-6px;top:-8px;width:18px;height:18px;border-radius:50%;background:var(--crest,#C8262F);color:#fff;font-size:10px;font-weight:900;display:grid;place-items:center;border:1.5px solid #fff}
.pc .nm{font-size:12px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .ps{font-size:9px;color:#5E6E64;font-weight:700}
.pc .sv{font-size:9px;color:#1F5A3A;font-weight:700}
.pc.gold{background:linear-gradient(180deg,#FFF6D6,#F5D27A);box-shadow:0 0 0 2px #E0A800,0 0 14px rgba(245,184,46,.8)}
.pc .mv{position:absolute;right:-6px;top:-8px;font-size:8px;font-weight:900;background:#F5B82E;color:#1A1A12;padding:1px 4px;border-radius:4px}
.pc.me{outline:2px solid #4FC3F7;outline-offset:1px}
@keyframes pcIn{from{opacity:0;transform:translate(-50%,-30%) scale(.7)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
#fbig .lg{max-width:460px;text-align:center;font-size:11px;color:rgba(255,255,255,.8)}

/* 라인업 상단 · 매치업 헤더 */
.lu-top{display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px}
.lu-top .t{font-size:17px;font-weight:900}
.lu-lock{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer}
.mu{background:var(--board);color:#EAF1EC;border-radius:12px;overflow:hidden;margin-bottom:8px}
.mu-top{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(90deg,var(--crest,#C8262F),#7a1419);padding:4px 4px;font-size:12px;font-weight:700}
.mu-top button{background:none;border:0;color:#fff;font-size:15px;width:32px;height:28px;cursor:pointer}
.mu-top button:disabled{opacity:.25;cursor:default}
.mu-teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:10px 12px 2px;text-align:center}
.mu-teams span{font-size:17px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mu-teams b{font-size:12px;color:var(--amber);font-weight:900}
.mu-sub{text-align:center;font-size:11px;color:#9DB5A6;padding:0 10px 9px}
.kbo .kr.sp{grid-template-columns:22px 1fr auto;background:rgba(200,38,47,.22);height:30px}

}

.seg{display:flex;gap:6px;margin:16px 0 8px}

.anapick::-webkit-scrollbar{display:none}
.anapick button{flex:0 0 auto;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:13px;font-weight:700;white-space:nowrap;cursor:pointer}
.anapick button[aria-pressed=true]{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
.seg button{flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer}
.recseg button{font-size:13px;padding:9px 4px;white-space:nowrap;letter-spacing:-.3px}
.seg button[aria-pressed=true]{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
.sumrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.sumrow div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 4px;text-align:center}
.sumrow b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.sumrow span{font-size:11px;color:var(--mute)}

/* 라인업 만들기 */
.bd-bar{display:flex;gap:6px;flex-wrap:wrap;padding:4px 0 8px}
.bd-bar button,.bd-btn{flex:none;min-height:40px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.bd-bar button:active,.bd-btn:active{transform:scale(.96)}
.bd-bar .hot{background:var(--amber);color:#1A1A12;border-color:var(--amber)}
.dhchk{display:flex;align-items:center;gap:8px;margin:2px 0 8px;font-size:14px;font-weight:700;cursor:pointer}
.dhchk input{width:22px;height:22px;accent-color:var(--chip-on)}
.coach{margin:8px 0;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--chip-on);font-size:13px;line-height:1.7}
.coach b{color:var(--chip-on)}
.coach .h{font-weight:900;font-size:14px;margin-bottom:4px}
.bd-hint{font-size:13px;margin:8px 0;padding:9px 12px;border-radius:10px;background:var(--surface);border:1px dashed var(--mute);color:var(--mute)}
.bd-hint b{color:var(--ink)}
.bslot{position:absolute;transform:translate(-50%,-50%);min-width:54px;max-width:86px;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.2;border-radius:12px;font-size:13px;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.bslot.empty{border:2px dashed rgba(255,255,255,.75);color:#fff;border-radius:999px;font-size:12px;font-weight:700;background:rgba(0,0,0,.18)}
.bslot.full{background:#fff;color:#14201A;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.35);padding:3px 8px}
.bslot.full small{display:block;font-size:10px;color:#2F7A4E;font-weight:700}
.bslot.sel,.cand.sel{outline:3px solid var(--amber);outline-offset:1px}
.bslot.over{outline:3px solid #fff}
.dhrow{display:flex;align-items:center;gap:10px;margin:10px 0 0}
.dhrow .bslot{position:relative;transform:none;left:auto;top:auto;background:var(--surface);color:var(--ink);border:2px dashed var(--mute);min-width:96px;max-width:none}
.dhrow .bslot.full{border:1px solid var(--line)}
.cands{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px;min-height:46px;padding:8px;border-radius:12px;border:1px dashed var(--line)}
.cands.over{border-color:var(--amber);background:rgba(245,184,46,.12)}
.cand{min-height:44px;padding:6px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:700;display:flex;flex-direction:column;justify-content:center;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.cand small{font-size:11px;color:var(--mute);font-weight:400;font-variant-numeric:tabular-nums}
.cand.maybe{opacity:.6}
.bo{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:6px}
.bo .no{flex:none;width:26px;text-align:center;font-weight:900;font-variant-numeric:tabular-nums}
.bo .nm{flex:1;min-width:0;font-weight:700}
.bo .nm small{color:var(--mute);font-weight:400;margin-left:6px}
.bo button{flex:none;width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--bg);cursor:pointer}
.ghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-120%);background:var(--amber);color:#1A1A12;font-weight:900;padding:8px 14px;border-radius:12px;box-shadow:0 6px 16px rgba(0,0,0,.4)}

/* 더보기 · 팀원 기록 */
.more{display:block;width:100%;margin:10px 0 4px;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;cursor:pointer;color:var(--chip-on)}
.mstat{font-size:12px;color:var(--ink);margin-top:3px;font-variant-numeric:tabular-nums}
.mstat b{color:var(--chip-on)}

/* 카드 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.game{border-left:4px solid var(--line)}
.game.win{border-left-color:var(--win)}
.game.loss{border-left-color:var(--loss)}
.game.draw{border-left-color:var(--draw)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.date{font-size:14px;color:var(--mute)}
.opp{font-size:17px;font-weight:700;margin-top:2px}
.score{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.badge{display:inline-block;min-width:28px;text-align:center;padding:2px 8px;border-radius:6px;font-weight:700;font-size:13px;color:#fff;background:var(--draw)}
.badge.win{background:var(--win)} .badge.loss{background:var(--loss)}
.review{margin:10px 0 0;white-space:pre-line;font-size:15px}
.photos{display:flex;gap:8px;overflow-x:auto;margin-top:12px;padding-bottom:2px}
.photos img{height:120px;min-width:90px;width:auto;border-radius:8px;flex:none;cursor:pointer;background:var(--line);object-fit:cover}
.next-row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}

/* 칩 */
.chips{display:flex;gap:8px;overflow-x:auto;padding:16px 0 4px}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on);font-weight:700}

/* 라인업 */
.lineup-head{margin:14px 0 10px;font-size:15px;color:var(--mute)}
.order{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.order .no{flex:none;min-width:34px;height:34px;padding:0 8px;border-radius:999px;background:var(--board);color:var(--amber);display:grid;place-items:center;font-weight:900;font-variant-numeric:tabular-nums}
.order .who{flex:1;min-width:0}
.order .nm{font-weight:700;font-size:16px}
.order .sub{font-size:13px;color:var(--mute)}
.pos{flex:none;font-weight:700;font-size:14px;padding:4px 10px;border-radius:8px;border:1px solid var(--line)}

/* 야구장 */
.field{position:relative;aspect-ratio:360/370;border-radius:14px;overflow:hidden;background:#163A27;margin:4px 0 0}
.field svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.fp{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none}
.fo{min-width:22px;height:22px;padding:0 5px;border-radius:999px;background:var(--amber);color:#1A1A12;font-size:12px;font-weight:900;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.fn{background:rgba(6,16,11,.78);color:#fff;font-size:12px;font-weight:700;padding:1px 7px;border-radius:6px;white-space:nowrap}

/* 팀원 */
.search{width:100%;margin:16px 0 4px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:16px}
.count{font-size:13px;color:var(--mute);margin:8px 2px}
.member{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.member .num{flex:none;width:44px;text-align:center;font-size:24px;font-weight:900;font-variant-numeric:tabular-nums}
.member .avatar{flex:none;width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--line)}
.member .nm{font-weight:700;font-size:16px}
.member .sub{font-size:13px;color:var(--mute)}

/* 하단 탭 */
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;border-top:3px solid transparent;padding:14px 0 12px;font-size:15px;font-weight:500;color:var(--mute);cursor:pointer}
nav button[aria-current="page"]{color:var(--ink);font-weight:900;border-top-color:var(--amber)}

/* 사진 확대 */
#lightbox{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;padding:16px}
#lightbox.on{display:flex}
#lightbox img{max-width:100%;max-height:100%;border-radius:8px}

/* ---------- 모바일 최적화 ---------- */
html{-webkit-tap-highlight-color:transparent}
button,.chip,input{touch-action:manipulation}
body{overscroll-behavior-x:none}
header{padding-bottom:10px}
header h1{font-size:19px}
.icon-btn{min-height:40px;padding:8px 14px}
.chip{min-height:44px;padding:10px 16px;font-size:15px}
.board .go{min-height:40px;padding:10px 16px;font-size:14px}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 8px;font-size:12px;min-height:58px}
nav svg{width:22px;height:22px}
.photos{scroll-snap-type:x proximity}
.photos img{height:150px;scroll-snap-align:start}
#lightbox img{touch-action:pinch-zoom}
.lb-close{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:20px;cursor:pointer}
@media (max-width:420px){
  main{padding:0 12px 16px}
  .board{flex-direction:column;align-items:flex-start;gap:8px;padding:16px}
  .board .dday{font-size:46px}
  .field .fn{font-size:11px;padding:1px 5px}
  .field .fo{min-width:20px;height:20px;font-size:11px}
  .score{font-size:20px}
}
@media (max-height:480px) and (orientation:landscape){ header{position:static} }

/* ---------- 참석 체크 ---------- */
.attend{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.card > .attend:first-child{margin-top:0;padding-top:0;border-top:0}
.sum{display:flex;gap:6px;flex-wrap:wrap}
.sum span{font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--mute)}
.sum .y{color:var(--win);border-color:var(--win)}
.sum .n{color:var(--loss);border-color:var(--loss)}
.me{margin-top:10px;font-size:14px;color:var(--mute)}
.who-select{width:100%;min-height:44px;margin-top:6px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:16px;padding:0 12px}
.rsvp-row{display:flex;gap:8px;margin-top:8px}
.rsvp{flex:1;min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:15px;cursor:pointer}
.rsvp[aria-pressed="true"]{color:#fff;border-color:transparent}
.rsvp.y[aria-pressed="true"]{background:var(--win)}
.rsvp.n[aria-pressed="true"]{background:var(--loss)}
.rsvp.m[aria-pressed="true"]{background:var(--draw)}
.link{background:none;border:0;color:var(--mute);text-decoration:underline;padding:6px 4px;min-height:32px;cursor:pointer;font-size:13px}
details.roster{margin-top:6px;font-size:14px}
details.roster summary{cursor:pointer;color:var(--mute);min-height:34px;display:flex;align-items:center}
.roster p{margin:4px 0;line-height:1.6}
.absent{display:inline-block;margin-left:6px;font-size:12px;font-weight:700;padding:1px 7px;border-radius:6px;color:#fff;background:var(--loss);vertical-align:middle}
.absent.m{background:var(--draw)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 32px);background:rgba(6,16,11,.94);color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;z-index:15;display:none;text-align:center}
#toast.on{display:block}
.bat{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:6px;font-size:12px;font-weight:700;vertical-align:middle;white-space:nowrap}
.bat.first{background:var(--chip-on);color:var(--chip-on-ink)}
.bat.second{border:1px solid currentColor;color:var(--mute)}
.board .bat.first{background:var(--amber);color:#1A1A12}
.board .bat.second{color:#C9D8CE}
.att-fold{margin-top:10px;border-top:1px solid var(--line)}
.att-fold > summary{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:46px;cursor:pointer;font-weight:700;font-size:15px;list-style:none}
.att-fold > summary::-webkit-details-marker{display:none}
.att-fold > summary::after{content:"펼치기 ▾";font-weight:500;font-size:13px;color:var(--mute)}
.att-fold[open] > summary::after{content:"접기 ▴"}
.att-fold .attend{margin-top:0;padding-top:6px;border-top:0}
.who-row{display:flex;gap:8px;margin-top:6px}
.who-input{flex:1;min-width:0;min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:16px;padding:0 12px}
.who-ok{min-height:46px;padding:0 18px;border-radius:10px;border:0;background:var(--chip-on);color:var(--chip-on-ink);font-weight:700;font-size:15px;cursor:pointer}
#confirm{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
#confirm.on{display:flex}
#confirm .sheet{background:var(--surface);color:var(--ink);border-radius:16px;padding:22px 20px 20px;width:100%;max-width:420px}
#confirm p{margin:0 0 18px;font-size:17px;line-height:1.6;text-align:center}
#confirm .btns{display:flex;gap:10px}
#confirm button{flex:1;min-height:50px;border-radius:12px;font-weight:700;font-size:16px;cursor:pointer;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
#confirm .ok{background:var(--chip-on);color:var(--chip-on-ink);border-color:transparent}
</style>
</head>

const DAY = 86400000;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today0 = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
const keyOf = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const fmtDate = d => `${d.getMonth()+1}월 ${d.getDate()}일 (${'일월화수목금토'[d.getDay()]})`;

function parseDate(s){
  if(!s) return null;
  let m = s.match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
  if(m) return new Date(+m[1], +m[2]-1, +m[3]);
  m = s.match(/(\d{1,2})\s*[\/.\-월]\s*(\d{1,2})/);
  if(m) return new Date(new Date().getFullYear(), +m[1]-1, +m[2]);
  return null;
}
function batTag(g){
  const v = (g['선후공'] || '').trim();
  if(v.includes('선')) return '<span class="bat first" title="먼저 공격">선공</span>';
  if(v.includes('후')) return '<span class="bat second" title="나중에 공격">후공</span>';
  return '';
}
function resultInfo(g){
  const r = (g['결과'] || '').trim();
  if(!r) return null;
  if(/^(승|W|win)/i.test(r)) return {cls:'win', label:'승'};
  if(/^(패|L|lose|loss)/i.test(r)) return {cls:'loss', label:'패'};
  if(/^(무|D|draw|tie)/i.test(r)) return {cls:'draw', label:'무'};
  return {cls:'draw', label:r};
}

function imgUrl(u){

}

/* ---------- 구글 시트 읽기 ---------- */
function parseCSV(text){
  const rows = []; let row = [], cell = '', q = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(q){
      if(c === '"'){ if(text[i+1] === '"'){ cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if(c === '"') q = true;
    else if(c === ','){ row.push(cell); cell = ''; }
    else if(c === '\n' || c === '\r'){
      if(c === '\r' && text[i+1] === '\n') i++;
      row.push(cell); cell = ''; rows.push(row); row = [];
    } else cell += c;
  }
  if(cell !== '' || row.length){ row.push(cell); rows.push(row); }
  return rows;
}
function toObjects(rows){
  if(!rows.length) return [];
  const head = rows[0].map(h => h.trim());
  return rows.slice(1).filter(r => r.some(c => c.trim() !== '')).map(r => {
    const o = {}; head.forEach((h, i) => { if(h) o[h] = (r[i] || '').trim(); }); return o;
  });
}
// 스크립트 태그로 불러오는 방식이라 파일로 열어도, 어떤 주소에 올려도 막히지 않아요.
let _gv = 0;
function cellText(c){
  if(!c) return '';
  if(c.f != null && c.f !== '') return String(c.f);
  if(c.v == null) return '';
  const m = String(c.v).match(/^Date\((\d+),(\d+),(\d+)/);
  if(m) return `${m[1]}-${String(+m[2]+1).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  return String(c.v);
}
function loadTabJsonp(name){
  return new Promise((resolve, reject) => {
    const cb = '__gv' + (++_gv);
    const s = document.createElement('script');
    const timer = setTimeout(() => done(new Error(`"${name}" 탭 응답이 없어요. 인터넷 연결을 확인해 주세요`)), 15000);
    function done(err, rows){
      clearTimeout(timer); delete window[cb]; s.remove();
      err ? reject(err) : resolve(rows);
    }
    window[cb] = resp => {
      if(!resp || resp.status !== 'ok'){
        const e = resp && resp.errors && resp.errors[0];
        return done(new Error(`"${name}" 탭: ${(e && (e.detailed_message || e.message)) || '알 수 없는 오류'}`));
      }
      const rows = resp.table.rows.map(r => (r.c || []).map(cellText));
      const heads = resp.table.cols.map(c => (c.label || '').trim());
      // 제목 줄을 못 알아봤으면 첫 줄을 제목으로 사용
      done(null, heads.every(h => !h) ? toObjects(rows) : toObjects([heads, ...rows]));
    };
    s.onerror = () => done(new Error(`"${name}" 탭을 읽지 못했어요. 시트 공유 설정과 탭 이름을 확인해 주세요`));
    s.src = `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=responseHandler:${cb}&headers=1&sheet=${encodeURIComponent(name)}&_=${Date.now()}`;
    document.head.appendChild(s);
  });
}
// 위 방식이 막힌 환경을 위한 두 번째 방법 (CSV 요청)
async function loadTabCsv(name){
  const url = `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(name)}&_=${Date.now()}`;
  const res = await fetch(url, { cache: 'no-store' });
  if(!res.ok) throw new Error(`"${name}" 탭을 읽지 못했어요 (${res.status})`);
  const text = await res.text();
  if(/^\s*<(!doctype|html)/i.test(text)) throw new Error(`"${name}" 탭이 구글 로그인 화면으로 연결돼요. 시트 공유 설정을 확인해 주세요`);
  return toObjects(parseCSV(text));
}
async function loadTab(name){
  try{ return await loadTabJsonp(name); }
  catch(e1){
    try{ return await loadTabCsv(name); }
    catch(e2){ throw new Error(e1.message + ' (두 번째 방법: ' + (e2.message || e2) + ')'); }
  }
}

function paParse(s){
  s = String(s || '').replace(/\u200b/g, '').trim(); if(!s) return null;
  if(/^(4구|볼넷|고4|고의4구)$/.test(s)) return { kind: 'bb' }; if(/^(HP|사구|死球)$/.test(s)) return { kind: 'bb' };
  if(/삼진|낫아웃|^K$/.test(s)) return { kind: 'k' };
  const m = s.match(/^(좌중|우중|좌선|우선|좌|중|우|유|二|三|一|2|3|1|투|포|捕)/); if(!m) return null;
  const D = { '좌중': 'LC', '우중': 'RC', '좌선': 'LL', '우선': 'RL', '좌': 'LF', '중': 'CF', '우': 'RF', '유': 'SS', '二': '2B', '2': '2B', '三': '3B', '3': '3B', '一': '1B', '1': '1B', '투': 'P', '포': 'C', '捕': 'C' }[m[1]];
  const r = s.slice(m[1].length);
  const kind = /홈|런/.test(r) ? 'hr' : /^월?3|3루타|^3$/.test(r) ? 'h3' : /^월?2|2루타|^2$/.test(r) ? 'h2' : /안|^1$|타$/.test(r) ? 'h1' : /실/.test(r) ? 'e' : /희/.test(r) ? 'sac' : 'out';
  return { dir: D, kind, of: ['LC', 'RC', 'LL', 'RL', 'LF', 'CF', 'RF'].includes(D) };
}

// MVP 투표
function votesOf(key){
  const m = {}; (state.data.votes || []).forEach(v => { if(dkey(v) === key && v['투표자'] && v['후보']) m[String(v['투표자']).trim()] = String(v['후보']).trim(); });

}
function mvpBlock(g){
  const key = keyOf(g._d);
  const cand = [...new Set(byDate('boxBat', key).filter(usRow).concat(byDate('boxPit', key).filter(usRow)).map(r => r['이름']).filter(Boolean))];
  if(cand.length < 2 || !CONFIG.ATTEND_URL) return '';
  const closed = (today0() - g._d) / DAY > CONFIG.MVP_DAYS;
  if(closed){
    const vm0 = votesOf(key), c0 = {}; Object.values(vm0).forEach(p => c0[p] = (c0[p] || 0) + 1);
    const mx0 = Math.max(0, ...Object.values(c0)); if(!mx0) return '';
    const tops = Object.keys(c0).filter(p => c0[p] === mx0);
    return `<div class="mvp"><div class="mvp-fold" style="cursor:default"><span>🏅 MVP <b>👑 ${tops.map(esc).join(', ')}</b></span><span>${mx0}표 · 투표 마감</span></div></div>`;
  }
  const vm = votesOf(key), cnt = {}; Object.values(vm).forEach(p => cnt[p] = (cnt[p] || 0) + 1);
  const total = Object.keys(vm).length, mx = Math.max(0, ...cand.map(n => cnt[n] || 0));
  const me = (state.data.members.map(m => m['이름']).includes(state.me)) ? state.me : '', mine = me ? vm[me] : '';
  const list = cand.slice().sort((a, b) => (cnt[b] || 0) - (cnt[a] || 0));
  if(mine && !state.openMvp.has(key)){
    const lead = list[0], lc = cnt[lead] || 0;
    return `<div class="mvp"><button class="mvp-fold" data-act="mvp-open" data-key="${key}"><span>🏅 MVP 투표 완료 · <b>${esc(mine)}</b></span><span>${lc ? `👑 ${esc(lead)} ${lc}표 · ` : ''}${total}명 ▾</span></button></div>`;
  }
  return `<div class="mvp"><div class="mh">🏅 이번 경기 MVP 투표 <span>${total}명 투표${me && mine ? ` · 내 선택 ${esc(mine)} <button class="link" data-act="mvp-close" data-key="${key}">접기 ▴</button>` : ''}</span></div>
    ${me ? '' : `<div class="who-row"><input class="who-input" type="text" placeholder="내 이름 입력 후 투표" autocomplete="off" aria-label="내 이름"><button class="who-ok" data-act="set-me">확인</button></div>`}
    <div class="mchips">${list.map(n => { const c = cnt[n] || 0; return `<button class="mc" aria-pressed="${mine === n}" data-act="vote" data-date="${key}" data-name="${esc(n)}"><i style="width:${mx ? Math.round(c / mx * 100) : 0}%"></i><span>${c && c === mx ? '👑 ' : ''}${esc(n)}</span><span>${c}표</span></button>`; }).join('')}</div></div>`;
}
async function castVote(date, pick){
  const me = state.me; if(!me){ toast('위에 내 이름을 먼저 입력해 주세요'); return; }
  if(me === pick){ toast('나 자신에게는 투표할 수 없어요 😄'); return; }
  if((today0() - parseDate(date)) / DAY > CONFIG.MVP_DAYS){ toast('투표가 마감된 경기예요'); return; }
  const mineNow = votesOf(date)[me];
  if(mineNow === pick){ toast('이미 이 선수에게 투표했어요'); return; }
  state.data.votes = (state.data.votes || []).filter(v => !(dkey(v) === date && String(v['투표자']).trim() === me)).concat({ '날짜': date, '투표자': me, '후보': pick });
  state.openMvp.delete(date);
  rerenderKeepScroll();
  if(state.demo){ toast('미리보기라 저장은 되지 않아요'); return; }

    if(!j.ok) throw new Error(j.error || '저장 실패');
    toast(`${pick} 선수에게 투표했어요`); writeCache(state.data);
  }catch(e){
    if(e instanceof TypeError){ try{ await fetch(CONFIG.ATTEND_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'vote', date, voter: me, pick }) }); toast('투표를 보냈어요'); }catch(e2){ toast('투표하지 못했어요'); } }
    else{ toast('투표하지 못했어요: ' + (e.message || e), 4500); load(); }
  }
}

const TIER = ['', '브론즈', '실버', '골드', '다이아'];

const WX_ICON = c => c === 0 ? ['☀️','맑음'] : c <= 2 ? ['🌤️','구름 조금'] : c === 3 ? ['☁️','흐림'] : c <= 48 ? ['🌫️','안개'] : c <= 57 ? ['🌦️','이슬비'] : c <= 67 ? ['🌧️','비'] : c <= 77 ? ['🌨️','눈'] : c <= 82 ? ['🌧️','소나기'] : c <= 86 ? ['🌨️','눈'] : ['⛈️','뇌우'];
async function wxGet(g){
  const key = keyOf(g._d) + '|' + (g['시간'] || '') + '|' + (g['장소'] || '');
  state.wxCache = state.wxCache || {};
  if(state.wxCache[key]) return state.wxCache[key];
  const days = Math.round((g._d - today0()) / DAY);
  if(days > 5) return (state.wxCache[key] = { far: true });
  let lat = CONFIG.WX_LAT, lon = CONFIG.WX_LON, label = (CONFIG.WX_PLACE || '') + ' 기준';
  const place = String(g['장소'] || '').trim();
  const lt = parseFloat(g['위도']), ln = parseFloat(g['경도']);
  if(lt && ln){ lat = lt; lon = ln; label = place; }
  else if(place){
    try{
      const r = await (await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language=ko&country_code=KR&name=' + encodeURIComponent(place))).json();
      if(r.results && r.results[0]){ lat = r.results[0].latitude; lon = r.results[0].longitude; label = place; }
    }catch(e){}
  }
  const ds = keyOf(g._d), hm = String(g['시간'] || '').match(/(\d{1,2})\s*[:시]\s*(\d{0,2})/);
  const hh = hm ? Math.min(23, +hm[1]) : 12;
  const u = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,precipitation_probability,weather_code,wind_speed_10m&timezone=Asia%2FSeoul&start_date=${ds}&end_date=${ds}`;
  const j = await (await fetch(u)).json();
  const h = j.hourly; if(!h || !h.time || !h.time.length) throw new Error(j.reason || 'no data');
  const at = i => ({ t: Math.round(h.temperature_2m[i]), p: h.precipitation_probability[i], c: h.weather_code[i], w: Math.round(h.wind_speed_10m[i] / 3.6 * 10) / 10 });
  const i = Math.min(hh, h.time.length - 1), i2 = Math.min(hh + 2, h.time.length - 1);
  return (state.wxCache[key] = { a: at(i), b: at(i2), label, hh });
}

function loreLine(key){ return `<span class="muted">${say('lore' + key, LORE)}</span>`; }
function bdCoach(pool){
  const b = state.build, dh = b.dh;
  const n = Math.min(pool.length, dh ? 10 : 9);
  const val = x => stat(x, 'OPS');
  const sb = x => stat(x, '도루');
  const era = x => { const r = recOf('seasonPit').find(y => y['이름'] === x); return r ? N(r['ERA']) : 99; };
  const nm = x => esc(x);
  const notes = [];
  // 1) 투수: 투수 기록이 있는 후보 중 평균자책 가장 낮은 선수 (3이닝 이상)
  let P = pool.filter(x => pitInn(x) >= 9).sort((a, c) => era(a) - era(c))[0] || pool.filter(x => defOf(x, 'P').g > 0).sort((a, c) => defOf(c, 'P').g - defOf(a, 'P').g)[0] || '';
  // 2) 포수: 포수 가능한 후보 중 타격 좋은 선수
  // 팀원 탭 포지션 입력값은 보지 않고, 박스스코어 출전 경험 + 수비 점수로만 정해요
  const gAll = x => SLOTS.reduce((t, k) => t + defOf(x, k).g, 0);
  const fit = (x, k) => { const c = defOf(x, k), w = Math.min(1, c.ch / 10), tg = gAll(x); return Math.max(val(x), 0) + (c.ch ? (defRate(c) - .75) * .6 * w : 0) + Math.min(c.g, 10) * .015 + (tg ? c.g / tg * .1 : 0); };
  let C = pool.filter(x => x !== P && defOf(x, 'C').g > 0).sort((a, c) => fit(c, 'C') - fit(a, 'C'))[0] || '';
  const chosen = [P, C].filter(Boolean);
  pool.filter(x => !chosen.includes(x)).sort((a, c) => val(c) - val(a)).slice(0, n - chosen.length).forEach(x => chosen.push(x));
  const bench = pool.filter(x => !chosen.includes(x)).sort((a, c) => val(c) - val(a));
  // 3) 수비 위치: 가능한 포지션 우선, 남으면 타격 좋은 순서로 채우기
  const slots = {}; if(P) slots.P = P; if(C) slots.C = C;
  let rest = chosen.filter(x => x !== P && x !== C).sort((a, c) => val(c) - val(a));
  const need = SLOT_PRIORITY.filter(k => !slots[k]).slice(0, Math.min(9, chosen.length) - Object.keys(slots).length);
  const why = {};
  // 그 자리를 볼 수 있는 후보 중 타격(OPS) + 수비(처리율·경험) 점수가 가장 높은 선수
  need.forEach(k => { const cand = rest.filter(x => defOf(x, k).g > 0); if(!cand.length) return; const x = cand.sort((a, c) => fit(c, k) - fit(a, k))[0]; rest.splice(rest.indexOf(x), 1); slots[k] = x;
    const c = defOf(x, k), bits = [`${SLOT_LABEL[k]} ${c.g}경기 출전`]; if(c.ch >= 3) bits.push(`처리율 ${Math.round(defRate(c) * 100)}%${c.e ? `·실책 ${c.e}` : ''}`);
    if(cand.length > 1) bits.push(`후보 ${cand.length}명 중 타격+수비 1위`); why[k] = bits.join(', '); });
  need.filter(k => !slots[k]).forEach(k => { if(rest.length){ slots[k] = rest.shift(); why[k] = k === 'P' ? '투수 경험자가 없어 임시 배치, 직접 정해 주세요' : '이 자리 출전 경험자가 없어 타격순'; } });
  if(dh && rest.length){ slots.DH = rest.shift(); why.DH = '타격 집중'; }
  // 4) 타순: 1번 출루율(+도루), 3번 OPS 최고, 4번 장타율, 2번 다음 OPS, 나머지 OPS순
  const left = chosen.filter(x => !(slots.DH && slots.P && x === slots.P)), take = fn => { left.sort((a, c) => fn(c) - fn(a)); return left.shift(); };
  const o1 = take(x => stat(x, '출루율') + sb(x) * 0.004), o3 = take(val), o4 = take(x => stat(x, '장타율')), o2 = take(val);
  const order = [o1, o2, o3, o4].concat(left.sort((a, c) => val(c) - val(a))).filter(Boolean);
  setSlots(slots, order);
  const T = (x, k) => { const r = batRowOf(x); return r ? fmtStat(k, r[k]) : '-'; };
  if(P) notes.push(`⚾ 마운드는 <b>${nm(P)}</b> — 평균자책 ${fmtStat('ERA', era(P))}. ` + say('P' + b.key + P, ['투수 후보 중 가장 안정적이에요.', '“야구는 투수 놀음” — 오늘 승부의 열쇠예요.', '초구 스트라이크만 잘 잡아도 절반은 성공.', '매덕스처럼 제구와 완급으로 끌고 가 봐요.']));
  else notes.push('⚾ 투수 기록이 있는 후보가 없어서 투수는 직접 정해 주세요.');
  if(C) notes.push(`🧤 안방은 <b>${nm(C)}</b> — ` + say('C' + b.key + C, ['포수 가능 선수 중 방망이가 가장 좋아요.', '투수와 호흡이 오늘의 핵심. 위기엔 바깥쪽 낮게!', '팝타임 빠르게 — 도루 하나 잡으면 흐름이 와요.']));
  if(o1) notes.push(`1번 <b>${nm(o1)}</b> — 출루율 ${T(o1, '출루율')}. ` + say('1' + b.key + o1, ['나가면 뛰는 리드오프.', '이치로처럼 내야 땅볼도 전력질주!', '선두타자 출루가 오늘 득점의 시작이에요.', '공 많이 보고 상대 투수 구종을 팀에 알려 줘요.']));
  if(o3) notes.push(`3번 <b>${nm(o3)}</b> — OPS ${T(o3, 'OPS')}. ` + say('3' + b.key + o3, ['팀 최고의 타자를 3번에 — MLB 정석이에요.', '1회부터 타석이 돌아오는 팀의 중심.', '주자 있으면 해결, 없으면 출루. 만능 역할.']));
  if(o4) notes.push(`4번 <b>${nm(o4)}</b> — 장타율 ${T(o4, '장타율')}. ` + say('4' + b.key + o4, ['KBO 전통의 해결사 자리.', '앞에 쌓인 주자를 쓸어 담아 주세요.', '한 방이 필요할 때 믿고 맡기는 타순.']));
  if(bench.length) notes.push(`아쉽게 벤치: ${bench.slice(0, 3).map(x => `${nm(x)}(OPS ${T(x, 'OPS')}${N((batRowOf(x) || {})['타석']) < 8 ? ', 타석 적음' : ''})`).join(', ')} — 경기 중 대타·교체로 준비.`);
  const pos = SLOT_PRIORITY.concat('DH').filter(k => why[k] && slots[k]).map(k => `${SLOT_LABEL[k]} <b>${nm(slots[k])}</b>(${why[k]})`);
  if(pos.length) notes.push('🧢 수비 배치 — ' + pos.join(' · '));
  notes.push(loreLine('c' + b.key));
  notes.push('<span class="muted">올 시즌 기록과 실제 출전 포지션(박스스코어)·수비 기록으로 계산한 추천이에요. 타석이 적은 선수는 기록을 낮춰 반영해요. 마음에 안 들면 바로 바꿔 보세요!</span>');
  b.coach = notes;
}
function bdAuto(kind){
  const b = state.build, pool = poolNames(b.key, b.pool);
  if(pool.length < 2){ toast('후보가 2명 이상 있어야 해요. 위에서 “전체 팀원”으로 바꿔 보세요'); return; }
  const n = Math.min(pool.length, b.dh ? 10 : 9);
  let chosen, order;
  if(kind === 'coach'){ bdCoach(pool); return; }
  if(kind === 'random'){
    chosen = shuffle(pool).slice(0, n);
    const ss = shuffle(SLOTS), slots = {}; chosen.forEach((nm, i) => slots[i < 9 ? ss[i] : 'DH'] = nm);
    setSlots(slots, shuffle(chosen)); return;
  }
  const key = kind === 'classic' ? 'OPS' : kind;
  // 이미 배치한 선수의 포지션은 그대로 두고, 빈 자리만 남은 후보(성적 좋은 순)로 랜덤 포지션에 채워요
  const slots = {};
  Object.keys(b.slots).forEach(k => { if(pool.includes(b.slots[k]) && (b.dh || k !== 'DH')) slots[k] = b.slots[k]; });
  const placed = Object.values(slots);
  const freeSlots = shuffle(SLOTS.concat(b.dh ? ['DH'] : []).filter(k => !slots[k]));
  pool.filter(x => !placed.includes(x)).sort((a, c) => stat(c, key) - stat(a, key)).slice(0, freeSlots.length).forEach((x, i) => { slots[freeSlots[i]] = x; });
  chosen = Object.values(slots);
  const batters = slots.DH && slots.P ? chosen.filter(x => x !== slots.P) : chosen;
  order = batters.slice().sort((a, c) => stat(c, key) - stat(a, key));
  if(kind === 'classic'){
    const left = batters.slice(), pick = (k) => { left.sort((a, c) => stat(c, k) - stat(a, k)); return left.shift(); };
    order = [pick('출루율'), pick('출루율'), pick('OPS'), pick('장타율')].filter(Boolean);
    left.sort((a, c) => stat(c, 'OPS') - stat(a, 'OPS')); order = order.concat(left);
  }
  setSlots(slots, order);
}
function bdShuffleOrder(){ const b = state.build; if(b.order.length < 2) return; b.order = shuffle(b.order); b.sel = null; saveDraft(); }
function bdShufflePos(){

  const ks = Object.keys(b.slots), sh = shuffle(names), slots = {}; ks.forEach((k, i) => slots[k] = sh[i]); setSlots(slots, b.order);
}
function bdLoadReal(){

function bdRows(order, slots){
  const lab = n => SLOT_LABEL[Object.keys(slots).find(k => slots[k] === n)] || '';
  const r = order.map((n, i) => ({ order: i + 1, name: n, pos: lab(n) }));
  if(slots.DH && slots.P && !order.includes(slots.P)) r.push({ order: '-', name: slots.P, pos: '투수' });
  return r;
}

/* 끌어서 놓기: 마우스는 바로, 터치는 꾹 눌러서(스크롤과 구분) */
let drag = null, ghostEl = null;
function dragEnd(){ if(drag && drag.timer) clearTimeout(drag.timer); if(ghostEl){ ghostEl.remove(); ghostEl = null; } document.querySelectorAll('.over').forEach(e => e.classList.remove('over')); drag = null; }
function dragStart(){ if(!drag) return; drag.active = true; ghostEl = document.createElement('div'); ghostEl.className = 'ghost'; ghostEl.textContent = drag.name; document.body.appendChild(ghostEl); dragMove(drag.x, drag.y); if(navigator.vibrate) try{ navigator.vibrate(15); }catch(e){} }
function dragMove(x, y){
  if(ghostEl){ ghostEl.style.left = x + 'px'; ghostEl.style.top = y + 'px'; }
  document.querySelectorAll('.over').forEach(e => e.classList.remove('over'));
  const t = document.elementFromPoint(x, y), h = t && t.closest('[data-slot],#bd-pool'); if(h) h.classList.add('over');
}
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-drag]'); if(!el || state.luMode !== 'build') return;
  drag = { name: el.dataset.drag, from: el.dataset.from || '', sx: e.clientX, sy: e.clientY, x: e.clientX, y: e.clientY, active: false, touch: e.pointerType === 'touch', timer: null };
  if(drag.touch) drag.timer = setTimeout(dragStart, 300);
});
document.addEventListener('pointermove', e => {
  if(!drag) return; drag.x = e.clientX; drag.y = e.clientY;
  const dist = Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy);
  if(!drag.active){
    if(drag.touch){ if(dist > 10){ clearTimeout(drag.timer); drag = null; } }
    else if(dist > 6) dragStart();
    return;
  }
  dragMove(e.clientX, e.clientY);
});
document.addEventListener('touchmove', e => { if(drag && drag.active) e.preventDefault(); }, { passive: false });
document.addEventListener('pointerup', e => {
  if(!drag) return;
  if(!drag.active){ dragEnd(); return; }
  const d = drag, t = document.elementFromPoint(e.clientX, e.clientY);
  dragEnd(); window.__noClick = true; setTimeout(() => window.__noClick = false, 350);
  const slotEl = t && t.closest('[data-slot]'), pool = t && t.closest('#bd-pool');
  if(slotEl) bdPlace(d.name, slotEl.dataset.slot);
  else if(pool && d.from) bdRemove(d.from);
  rerenderKeepScroll();
});
document.addEventListener('pointercancel', () => dragEnd());

document.addEventListener('click', e => {

  else if(act === 'fbig-bg'){ if(e.target === el) closeBigField(); }
  else if(act === 'share-card'){ shareCard(el.dataset.key); }
  else if(act === 'cal-sub'){ calSub(); }
  else if(act === 'share-opp'){ shareOpp(el.dataset.key); }
  else if(act === 'share-season'){ shareSeason(); }
  else if(act === 'pd-close'){ closePlayer(); }
  else if(act === 'pd-bg'){ if(e.target === el) closePlayer(); }
  else if(act === 'mvp-open'){ state.openMvp.add(el.dataset.key); rerenderKeepScroll(); }
  else if(act === 'mvp-close'){ state.openMvp.delete(el.dataset.key); rerenderKeepScroll(); }
  else if(act === 'pr-adj'){ const d = state.predDraft[el.dataset.key]; if(d){ d[el.dataset.side] = Math.max(0, Math.min(40, d[el.dataset.side] + +el.dataset.d)); rerenderKeepScroll(); } }
  else if(act === 'opp-side'){ state.oppSide = el.dataset.side; rerenderKeepScroll(); }
  else if(act === 'pr-save'){ savePredict(el.dataset.key); }
  else if(act === 'vote'){ castVote(el.dataset.date, el.dataset.name); }
  else if(act.startsWith('bd-') || act === 'lu-mode'){
    if(window.__noClick) return;
    const b = state.build;
    if(act === 'lu-mode'){ if(el.dataset.mode === 'build' && !state.pw){ bdAskPw(); return; } state.luMode = el.dataset.mode; render(); return; }
    if(act === 'bd-key'){ state.build = null; state.build = { key: el.dataset.key, pool: 'att', slots: {}, order: [], dh: true, sel: null }; const d = readDrafts()[el.dataset.key]; if(d){ state.build.slots = d.slots; state.build.order = d.order; state.build.dh = d.dh !== false; } if(!Object.values(attendMap()[el.dataset.key] || {}).some(v => v === '참석')) state.build.pool = 'all'; }
    else if(act === 'bd-dh'){ b.dh = el.checked; if(!b.dh && b.slots.DH) bdRemove('DH'); saveDraft(); }
    else if(act === 'bd-pool') b.pool = el.dataset.pool;
    else if(act === 'bd-attend' || act === 'bd-unattend'){
      const n = el.dataset.name, ans = act === 'bd-attend' ? '참석' : '';
      state.data.attend = (state.data.attend || []).filter(r => !(r.date === b.key && r.name === n));
      state.data.attend.push({ date: b.key, name: n, answer: ans || '미정' });
      b.manual = (b.manual || []).filter(x => x !== n); if(ans) b.manual.push(n);

    else if(act === 'bd-pull'){ if(b.sel && b.sel.from) bdRemove(b.sel.from); }
    else if(act === 'bd-auto') bdAuto(el.dataset.kind);
    else if(act === 'bd-shuf-order') bdShuffleOrder();
    else if(act === 'bd-shuf-pos') bdShufflePos();
    else if(act === 'bd-real') bdLoadReal();
    else if(act === 'bd-clear'){ setSlots({}, []); }
    else if(act === 'bd-up' || act === 'bd-down'){ const i = +el.dataset.i, j = act === 'bd-up' ? i - 1 : i + 1; if(j >= 0 && j < b.order.length){ [b.order[i], b.order[j]] = [b.order[j], b.order[i]]; saveDraft(); } }
    else if(act === 'bd-copy'){ bdCopy(); return; }
    else if(act === 'bd-save'){ bdAsk(); return; }
    else if(act === 'bd-lock'){ lockLineup('잠갔어요'); }
    rerenderKeepScroll();
  }
  else if(act === 'more'){ state.more[el.dataset.k] = !state.more[el.dataset.k]; render(); }
  else if(act === 'box-side'){ state.boxSide[el.dataset.key] = el.dataset.side; render(); }
  else if(act === 'rec-year'){ state.year = el.dataset.y; render(); }
  else if(act === 'rec-sub'){ state.recSub = el.dataset.sub; render(); }
  else if(act === 'sort'){ state.recSort[el.dataset.kind] = el.dataset.col; render(); }
  else if(act === 'lineup-key'){ if(!el.dataset.key) return; state.lineupKey = el.dataset.key; render(); }
  else if(act === 'goto-ana'){ state.anaKey = el.dataset.key; state.tab = 'analysis'; render(); window.scrollTo(0, 0); }
  else if(act === 'ana-pick'){ state.anaKey = el.dataset.key; rerenderKeepScroll(); }
  else if(act === 'goto-lineup'){ state.lineupKey = el.dataset.key; state.tab = 'lineup'; render(); window.scrollTo(0, 0); }
  else if(act === 'photo'){
    const box = document.getElementById('lightbox');
    box.querySelector('img').src = el.dataset.src; box.classList.add('on');
  }
  else if(act === 'close-photo'){ document.getElementById('lightbox').classList.remove('on'); }
  else if(act === 'rsvp'){ askRsvp(el.dataset.date, el.dataset.ans); }
  else if(act === 'set-me'){ setMe(el.parentElement.querySelector('input').value); }
  else if(act === 'confirm-ok'){ const p = state.pending, pv = (document.getElementById('pwin') || {}).value; closeConfirm(); if(p) (p.type === 'pw' ? bdCheckPw(pv) : p.type === 'lineup' ? bdSave() : rsvp(p.date, p.ans)); }
  else if(act === 'confirm-cancel'){ closeConfirm(); }
  else if(act === 'change-me'){ state.me = ''; try{ localStorage.removeItem(ME_KEY); }catch(e){} render(); }
});
document.getElementById('confirm').addEventListener('click', e => { if(e.target.id === 'confirm') closeConfirm(); });
document.addEventListener('toggle', e => {
  const d = e.target;
  if(!d.classList) return;
  if(d.classList.contains('roster')) d.open ? state.openAttend.add(d.dataset.key) : state.openAttend.delete(d.dataset.key);
  else if(d.classList.contains('box')) d.open ? state.openBox.add(d.dataset.key) : state.openBox.delete(d.dataset.key);
  else if(d.classList.contains('att-fold')) d.open ? state.openFold.add(d.dataset.key) : state.openFold.delete(d.dataset.key);
}, true);
document.addEventListener('change', e => {
  if(e.target.id === 'cmpSel' && e.target.value){ const pb = document.getElementById('pdBody'); pb.innerHTML = compareView(e.target.dataset.me, e.target.value); pb.scrollTop = 0; }
});
document.addEventListener('input', e => {
  if(e.target.dataset && e.target.dataset.act === 'pb-seek'){ pbAct('pb-seek', e.target); return; }
  if(e.target.id === 'search'){ state.query = e.target.value; document.getElementById('mlist').innerHTML = membersList(); }
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ document.getElementById('lightbox').classList.remove('on'); closeConfirm(); closePlayer(); closeBigField(); pbClose(); }
  if(e.key === 'Enter' && e.target.id === 'pwin'){ const v = e.target.value; closeConfirm(); bdCheckPw(v); }
  else if(e.key === 'Enter' && e.target.classList && e.target.classList.contains('who-input')) setMe(e.target.value);
});
// 앱으로 돌아왔을 때 1분 이상 지났으면 자동으로 최신 내용 불러오기
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && CONFIG.SHEET_ID && Date.now() - state.lastLoad > 60000) load();
});

// 뒤로가기: 열린 창·라인업 만들기·다른 탭을 먼저 닫고, 더 닫을 게 없으면 진짜 뒤로가기
(function(){
  try{ history.replaceState({ base: 1 }, ''); history.pushState({ app: 1 }, ''); }catch(e){ return; }
  const isOn = id => { const el = document.getElementById(id); return el && el.classList.contains('on'); };
  window.addEventListener('popstate', () => {
    let handled = true;
    if(isOn('confirm')) closeConfirm();
    else if(isOn('lightbox')) document.getElementById('lightbox').classList.remove('on');
    else if(isOn('fbig')) closeBigField();
    else if(isOn('pb')) pbClose();
    else if(isOn('pd')) closePlayer();
    else if(state.tab === 'lineup' && state.luMode === 'build'){ state.luMode = 'view'; render(); }
    else if(state.tab !== 'schedule'){ state.tab = 'schedule'; render(); window.scrollTo(0, 0); }
    else handled = false;
    if(handled){ try{ history.pushState({ app: 1 }, ''); }catch(e){} }
    else history.back();
  });
})();
render();
load();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E2418">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="가락불스">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E⚾%3C/text%3E%3C/svg%3E">
<title>가락불스 야구 페이지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F6F1; --surface:#FFFFFF; --ink:#14201A; --mute:#5E6E64; --line:#DCE4DB;
  --board:#0E2418; --amber:#F5B82E;
  --win:#1F7A4D; --loss:#B3412E; --draw:#6B7A72;
  --chip-on:#1F5A3A; --chip-on-ink:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0B1510; --surface:#13221A; --ink:#EAF1EC; --mute:#93A59A; --line:#22362A;
    --board:#06100B; --win:#3FA06C; --loss:#D4604B; --draw:#7F8F86;
    --chip-on:#4FAE7C; --chip-on-ink:#06100B;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  line-height:1.5; padding-bottom:calc(72px + env(safe-area-inset-bottom,0px));
}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* 헤더 */
header{
  position:sticky; top:0; z-index:5; background:var(--board); color:#EAF1EC;
  padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;
  display:flex; align-items:center; justify-content:space-between;
}
header h1{margin:0;font-size:20px;font-weight:900;letter-spacing:-.01em}
.icon-btn{background:none;border:1px solid #2F4A3A;border-radius:999px;color:#EAF1EC;padding:6px 12px;font-size:13px;cursor:pointer}

main{max-width:640px;margin:0 auto;padding:0 16px 16px}
h2{font-size:17px;margin:28px 0 10px;font-weight:700}
.muted{color:var(--mute)}
.notice{margin:16px 0 0;padding:10px 12px;border-radius:10px;background:var(--surface);border:1px dashed var(--mute);font-size:13px;color:var(--mute)}
.error{margin:24px 0;padding:16px;border-radius:12px;background:var(--surface);border:1px solid var(--loss)}
.error button{margin-top:8px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--bg);cursor:pointer}
.empty{padding:28px 8px;text-align:center;color:var(--mute)}

/* 다음 경기 전광판 */
.board{background:var(--board);color:#EAF1EC;border-radius:14px;padding:18px;margin:16px 0 0;display:flex;gap:18px;align-items:center}
.board .dday{font-size:54px;font-weight:900;line-height:1;color:var(--amber);font-variant-numeric:tabular-nums;letter-spacing:-.03em;flex:none}
.board .info{min-width:0}
.board .tag{font-size:13px;color:#9DB5A6}
.board .vs{font-size:21px;font-weight:700;margin:2px 0}
.board .meta{font-size:14px;color:#C9D8CE}
.board .go{margin-top:10px;background:var(--amber);color:#1A1A12;border:0;border-radius:8px;padding:7px 12px;font-weight:700;font-size:13px;cursor:pointer}

/* 기록 */
.box{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.box>summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--chip-on);list-style:none;padding:6px 0}
.box>summary::-webkit-details-marker{display:none}
.box>summary::before{content:'▸ ';}
.box[open]>summary::before{content:'▾ ';}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:6px -4px 10px;border:1px solid var(--line);border-radius:8px}
table.st{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
table.st th,table.st td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line)}
table.st th{background:var(--bg);font-weight:700;color:var(--mute);font-size:12px}
table.st th:first-child,table.st td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
table.st th:first-child{background:var(--bg)}
table.st tr.tot td{font-weight:700;background:var(--bg)}
table.st td.l,table.st th.l{text-align:left}
th.sortable{cursor:pointer}
th.sorted{color:var(--ink)}
.sub{font-size:12px;color:var(--mute);margin:10px 0 2px;font-weight:700}
.seg{display:flex;gap:6px;margin:16px 0 8px}
.seg button{flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
.sumrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.sumrow div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 4px;text-align:center}
.sumrow b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.sumrow span{font-size:11px;color:var(--mute)}

/* 라인업 만들기 */
.bd-bar{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;-webkit-overflow-scrolling:touch}
.bd-bar button,.bd-btn{flex:none;min-height:40px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.bd-bar button:active,.bd-btn:active{transform:scale(.96)}
.bd-bar .hot{background:var(--amber);color:#1A1A12;border-color:var(--amber)}
.bd-hint{font-size:13px;margin:8px 0;padding:9px 12px;border-radius:10px;background:var(--surface);border:1px dashed var(--mute);color:var(--mute)}
.bd-hint b{color:var(--ink)}
.bslot{position:absolute;transform:translate(-50%,-50%);min-width:54px;max-width:86px;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.2;border-radius:12px;font-size:13px;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.bslot.empty{border:2px dashed rgba(255,255,255,.75);color:#fff;border-radius:999px;font-size:12px;font-weight:700;background:rgba(0,0,0,.18)}
.bslot.full{background:#fff;color:#14201A;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.35);padding:3px 8px}
.bslot.full small{display:block;font-size:10px;color:#2F7A4E;font-weight:700}
.bslot.sel,.cand.sel{outline:3px solid var(--amber);outline-offset:1px}
.bslot.over{outline:3px solid #fff}
.dhrow{display:flex;align-items:center;gap:10px;margin:10px 0 0}
.dhrow .bslot{position:relative;transform:none;left:auto;top:auto;background:var(--surface);color:var(--ink);border:2px dashed var(--mute);min-width:96px;max-width:none}
.dhrow .bslot.full{border:1px solid var(--line)}
.cands{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px;min-height:46px;padding:8px;border-radius:12px;border:1px dashed var(--line)}
.cands.over{border-color:var(--amber);background:rgba(245,184,46,.12)}
.cand{min-height:44px;padding:6px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:700;display:flex;flex-direction:column;justify-content:center;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.cand small{font-size:11px;color:var(--mute);font-weight:400;font-variant-numeric:tabular-nums}
.cand.maybe{opacity:.6}
.bo{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:6px}
.bo .no{flex:none;width:26px;text-align:center;font-weight:900;font-variant-numeric:tabular-nums}
.bo .nm{flex:1;min-width:0;font-weight:700}
.bo .nm small{color:var(--mute);font-weight:400;margin-left:6px}
.bo button{flex:none;width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--bg);cursor:pointer}
.ghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-120%);background:var(--amber);color:#1A1A12;font-weight:900;padding:8px 14px;border-radius:12px;box-shadow:0 6px 16px rgba(0,0,0,.4)}

/* 더보기 · 팀원 기록 */
.more{display:block;width:100%;margin:10px 0 4px;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;cursor:pointer;color:var(--chip-on)}
.mstat{font-size:12px;color:var(--ink);margin-top:3px;font-variant-numeric:tabular-nums}
.mstat b{color:var(--chip-on)}

/* 카드 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.game{border-left:4px solid var(--line)}
.game.win{border-left-color:var(--win)}
.game.loss{border-left-color:var(--loss)}
.game.draw{border-left-color:var(--draw)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.date{font-size:14px;color:var(--mute)}
.opp{font-size:17px;font-weight:700;margin-top:2px}
.score{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.badge{display:inline-block;min-width:28px;text-align:center;padding:2px 8px;border-radius:6px;font-weight:700;font-size:13px;color:#fff;background:var(--draw)}
.badge.win{background:var(--win)} .badge.loss{background:var(--loss)}
.review{margin:10px 0 0;white-space:pre-line;font-size:15px}
.photos{display:flex;gap:8px;overflow-x:auto;margin-top:12px;padding-bottom:2px}
.photos img{height:120px;min-width:90px;width:auto;border-radius:8px;flex:none;cursor:pointer;background:var(--line);object-fit:cover}
.next-row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}

/* 칩 */
.chips{display:flex;gap:8px;overflow-x:auto;padding:16px 0 4px}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on);font-weight:700}

/* 라인업 */
.lineup-head{margin:14px 0 10px;font-size:15px;color:var(--mute)}
.order{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.order .no{flex:none;min-width:34px;height:34px;padding:0 8px;border-radius:999px;background:var(--board);color:var(--amber);display:grid;place-items:center;font-weight:900;font-variant-numeric:tabular-nums}
.order .who{flex:1;min-width:0}
.order .nm{font-weight:700;font-size:16px}
.order .sub{font-size:13px;color:var(--mute)}
.pos{flex:none;font-weight:700;font-size:14px;padding:4px 10px;border-radius:8px;border:1px solid var(--line)}

/* 야구장 */
.field{position:relative;aspect-ratio:360/370;border-radius:14px;overflow:hidden;background:#163A27;margin:4px 0 0}
.field svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.fp{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none}
.fo{min-width:22px;height:22px;padding:0 5px;border-radius:999px;background:var(--amber);color:#1A1A12;font-size:12px;font-weight:900;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.fn{background:rgba(6,16,11,.78);color:#fff;font-size:12px;font-weight:700;padding:1px 7px;border-radius:6px;white-space:nowrap}

/* 팀원 */
.search{width:100%;margin:16px 0 4px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:16px}
.count{font-size:13px;color:var(--mute);margin:8px 2px}
.member{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.member .num{flex:none;width:44px;text-align:center;font-size:24px;font-weight:900;font-variant-numeric:tabular-nums}
.member .avatar{flex:none;width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--line)}
.member .nm{font-weight:700;font-size:16px}
.member .sub{font-size:13px;color:var(--mute)}

/* 하단 탭 */
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;border-top:3px solid transparent;padding:14px 0 12px;font-size:15px;font-weight:500;color:var(--mute);cursor:pointer}
nav button[aria-current="page"]{color:var(--ink);font-weight:900;border-top-color:var(--amber)}

/* 사진 확대 */
#lightbox{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;padding:16px}
#lightbox.on{display:flex}
#lightbox img{max-width:100%;max-height:100%;border-radius:8px}

/* ---------- 모바일 최적화 ---------- */
html{-webkit-tap-highlight-color:transparent}
button,.chip,input{touch-action:manipulation}
body{overscroll-behavior-x:none}
header{padding-bottom:10px}
header h1{font-size:19px}
.icon-btn{min-height:40px;padding:8px 14px}
.chip{min-height:44px;padding:10px 16px;font-size:15px}
.board .go{min-height:40px;padding:10px 16px;font-size:14px}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 8px;font-size:12px;min-height:58px}
nav svg{width:22px;height:22px}
.photos{scroll-snap-type:x proximity}
.photos img{height:150px;scroll-snap-align:start}
#lightbox img{touch-action:pinch-zoom}
.lb-close{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:20px;cursor:pointer}
@media (max-width:420px){
  main{padding:0 12px 16px}
  .board{flex-direction:column;align-items:flex-start;gap:8px;padding:16px}
  .board .dday{font-size:46px}
  .field .fn{font-size:11px;padding:1px 5px}
  .field .fo{min-width:20px;height:20px;font-size:11px}
  .score{font-size:20px}
}
@media (max-height:480px) and (orientation:landscape){ header{position:static} }

/* ---------- 참석 체크 ---------- */
.attend{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.card > .attend:first-child{margin-top:0;padding-top:0;border-top:0}
.sum{display:flex;gap:6px;flex-wrap:wrap}
.sum span{font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--mute)}
.sum .y{color:var(--win);border-color:var(--win)}
.sum .n{color:var(--loss);border-color:var(--loss)}
.me{margin-top:10px;font-size:14px;color:var(--mute)}
.who-select{width:100%;min-height:44px;margin-top:6px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:16px;padding:0 12px}
.rsvp-row{display:flex;gap:8px;margin-top:8px}
.rsvp{flex:1;min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:15px;cursor:pointer}
.rsvp[aria-pressed="true"]{color:#fff;border-color:transparent}
.rsvp.y[aria-pressed="true"]{background:var(--win)}
.rsvp.n[aria-pressed="true"]{background:var(--loss)}
.rsvp.m[aria-pressed="true"]{background:var(--draw)}
.link{background:none;border:0;color:var(--mute);text-decoration:underline;padding:6px 4px;min-height:32px;cursor:pointer;font-size:13px}
details.roster{margin-top:6px;font-size:14px}
details.roster summary{cursor:pointer;color:var(--mute);min-height:34px;display:flex;align-items:center}
.roster p{margin:4px 0;line-height:1.6}
.absent{display:inline-block;margin-left:6px;font-size:12px;font-weight:700;padding:1px 7px;border-radius:6px;color:#fff;background:var(--loss);vertical-align:middle}
.absent.m{background:var(--draw)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 32px);background:rgba(6,16,11,.94);color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;z-index:15;display:none;text-align:center}
#toast.on{display:block}
.bat{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:6px;font-size:12px;font-weight:700;vertical-align:middle;white-space:nowrap}
.bat.first{background:var(--chip-on);color:var(--chip-on-ink)}
.bat.second{border:1px solid currentColor;color:var(--mute)}
.board .bat.first{background:var(--amber);color:#1A1A12}
.board .bat.second{color:#C9D8CE}
.att-fold{margin-top:10px;border-top:1px solid var(--line)}
.att-fold > summary{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:46px;cursor:pointer;font-weight:700;font-size:15px;list-style:none}
.att-fold > summary::-webkit-details-marker{display:none}
.att-fold > summary::after{content:"펼치기 ▾";font-weight:500;font-size:13px;color:var(--mute)}
.att-fold[open] > summary::after{content:"접기 ▴"}
.att-fold .attend{margin-top:0;padding-top:6px;border-top:0}
.who-row{display:flex;gap:8px;margin-top:6px}
.who-input{flex:1;min-width:0;min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:16px;padding:0 12px}
.who-ok{min-height:46px;padding:0 18px;border-radius:10px;border:0;background:var(--chip-on);color:var(--chip-on-ink);font-weight:700;font-size:15px;cursor:pointer}
#confirm{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
#confirm.on{display:flex}
#confirm .sheet{background:var(--surface);color:var(--ink);border-radius:16px;padding:22px 20px 20px;width:100%;max-width:420px}
#confirm p{margin:0 0 18px;font-size:17px;line-height:1.6;text-align:center}
#confirm .btns{display:flex;gap:10px}
#confirm button{flex:1;min-height:50px;border-radius:12px;font-weight:700;font-size:16px;cursor:pointer;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
#confirm .ok{background:var(--chip-on);color:var(--chip-on-ink);border-color:transparent}
</style>
</head>
<body>

<!--
  ┌──────────────── 설정 방법 ────────────────┐
  │ 1) 아래 CONFIG.SHEET_ID에 구글 시트 주소의 ID를 붙여넣기
  │    https://docs.google.com/spreadsheets/d/ ★이 부분★ /edit
  │ 2) 시트 공유 → "링크가 있는 모든 사용자 - 뷰어"
  │ 3) 시트 탭 이름을 CONFIG.TABS와 똑같이 맞추기 (팀원 / 일정 / 라인업)
  │ SHEET_ID가 비어 있으면 샘플 데이터가 보입니다.
  └───────────────────────────────────────────┘
-->

<header>
  <h1 id="teamName"></h1>
  <button class="icon-btn" data-act="reload">새로고침</button>
</header>
<main id="app"></main>
<nav id="tabs"></nav>
<div id="toast" role="status" aria-live="polite"></div>
<div id="confirm" role="dialog" aria-modal="true" aria-labelledby="confirmText">
  <div class="sheet">
    <p id="confirmText"></p>
    <div class="btns"><button class="cancel" data-act="confirm-cancel">취소</button><button class="ok" data-act="confirm-ok">확인</button></div>
  </div>
</div>
<div id="lightbox" data-act="close-photo"><button class="lb-close" data-act="close-photo" aria-label="닫기">✕</button><img alt="경기 사진"></div>

<script>
const CONFIG = {
  SHEET_ID: '1t5ckHfUYsqVeMXTZypEHrIyhc9yDUT4JYqF3wD9x594',  // 구글 시트 ID
  TEAM_NAME: '가락불스',     // 팀 이름
  TABS: { members: '팀원', schedule: '일정', lineup: '라인업' },

function parseDate(s){
  if(!s) return null;
  let m = s.match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
  if(m) return new Date(+m[1], +m[2]-1, +m[3]);
  m = s.match(/(\d{1,2})\s*[\/.\-월]\s*(\d{1,2})/);
  if(m) return new Date(new Date().getFullYear(), +m[1]-1, +m[2]);
  return null;
}

/* ---------- 구글 시트 읽기 ---------- */
function parseCSV(text){
  const rows = []; let row = [], cell = '', q = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(q){
      if(c === '"'){ if(text[i+1] === '"'){ cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if(c === '"') q = true;
    else if(c === ','){ row.push(cell); cell = ''; }
    else if(c === '\n' || c === '\r'){
      if(c === '\r' && text[i+1] === '\n') i++;
      row.push(cell); cell = ''; rows.push(row); row = [];
    } else cell += c;
  }
  if(cell !== '' || row.length){ row.push(cell); rows.push(row); }
  return rows;
}
function toObjects(rows){
  if(!rows.length) return [];
  const head = rows[0].map(h => h.trim());
  return rows.slice(1).filter(r => r.some(c => c.trim() !== '')).map(r => {
    const o = {}; head.forEach((h, i) => { if(h) o[h] = (r[i] || '').trim(); }); return o;
  });
}
// 스크립트 태그로 불러오는 방식이라 파일로 열어도, 어떤 주소에 올려도 막히지 않아요.
let _gv = 0;
function cellText(c){
  if(!c) return '';
  if(c.f != null && c.f !== '') return String(c.f);
  if(c.v == null) return '';
  const m = String(c.v).match(/^Date\((\d+),(\d+),(\d+)/);
  if(m) return `${m[1]}-${String(+m[2]+1).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  return String(c.v);
}
function loadTabJsonp(name){
  return new Promise((resolve, reject) => {
    const cb = '__gv' + (++_gv);
    const s = document.createElement('script');
    const timer = setTimeout(() => done(new Error(`"${name}" 탭 응답이 없어요. 인터넷 연결을 확인해 주세요`)), 15000);
    function done(err, rows){
      clearTimeout(timer); delete window[cb]; s.remove();
      err ? reject(err) : resolve(rows);
    }
    window[cb] = resp => {
      if(!resp || resp.status !== 'ok'){
        const e = resp && resp.errors && resp.errors[0];
        return done(new Error(`"${name}" 탭: ${(e && (e.detailed_message || e.message)) || '알 수 없는 오류'}`));
      }
      const rows = resp.table.rows.map(r => (r.c || []).map(cellText));
      const heads = resp.table.cols.map(c => (c.label || '').trim());
      // 제목 줄을 못 알아봤으면 첫 줄을 제목으로 사용
      done(null, heads.every(h => !h) ? toObjects(rows) : toObjects([heads, ...rows]));
    };
    s.onerror = () => done(new Error(`"${name}" 탭을 읽지 못했어요. 시트 공유 설정과 탭 이름을 확인해 주세요`));
    s.src = `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=responseHandler:${cb}&headers=1&sheet=${encodeURIComponent(name)}&_=${Date.now()}`;
    document.head.appendChild(s);
  });
}
// 위 방식이 막힌 환경을 위한 두 번째 방법 (CSV 요청)
async function loadTabCsv(name){
  const url = `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(name)}`;
  const res = await fetch(url);
  if(!res.ok) throw new Error(`"${name}" 탭을 읽지 못했어요 (${res.status})`);
  const text = await res.text();
  if(/^\s*<(!doctype|html)/i.test(text)) throw new Error(`"${name}" 탭이 구글 로그인 화면으로 연결돼요. 시트 공유 설정을 확인해 주세요`);
  return toObjects(parseCSV(text));
}
async function loadTab(name){
  try{ return await loadTabJsonp(name); }
  catch(e1){
    try{ return await loadTabCsv(name); }
    catch(e2){ throw new Error(e1.message + ' (두 번째 방법: ' + (e2.message || e2) + ')'); }
  }
}

function attendBlock(g){

  const map = attendMap()[key] || {};
  const groups = {'참석':[], '불참':[], '미정':[], '미응답':[]};
  names.forEach(n => groups[map[n] || '미응답'].push(n));
  Object.keys(map).forEach(n => { if(!names.includes(n)) groups[map[n]].push(n); });
  const canRespond = !!(CONFIG.ATTEND_URL || state.demo) && names.length > 0;
  const total = groups['참석'].length + groups['불참'].length + groups['미정'].length;
  if(!canRespond && !total) return '';

  let me = '';

    const who = names.includes(state.me) ? state.me : '';

      ? `<div class="me">${esc(who)}님, 참석하시나요? <button class="link" data-act="change-me">이름 바꾸기</button></div>
         <div class="rsvp-row">${ANSWERS.map(a => `<button class="rsvp ${ANS_CLS[a]}" aria-pressed="${map[who] === a}" data-act="rsvp" data-date="${key}" data-ans="${a}">${a}</button>`).join('')}</div>`

         <div class="who-row"><input class="who-input" type="text" placeholder="이름 입력 (예: 홍길동)" autocomplete="off" enterkeyhint="done" aria-label="내 이름"><button class="who-ok" data-act="set-me">확인</button></div>`;
  }
  const rosterRows = ['참석','불참','미정','미응답'].filter(k => groups[k].length)
    .map(k => `<p><strong>${k}</strong> ${groups[k].map(esc).join(', ')}</p>`).join('');
  const roster = rosterRows ? `<details class="roster" data-key="${key}"${state.openAttend.has(key) ? ' open' : ''}><summary>명단 보기</summary>${rosterRows}</details>` : '';
  return `<div class="attend">${sum}${me}${roster}</div>`;

function initBuild(){
  const keys = buildKeys(), key = state.build && keys.includes(state.build.key) ? state.build.key : keys[0];
  if(state.build && state.build.key === key) return;
  const am = attendMap()[key] || {};
  const d = readDrafts()[key];
  state.build = { key, pool: Object.values(am).some(v => v === '참석') ? 'att' : 'all', slots: d ? d.slots : {}, order: d ? d.order : [], sel: null };
}
function saveDraft(){
  const b = state.build; if(!b) return;
  try{ const all = readDrafts(); all[b.key] = { slots: b.slots, order: b.order }; localStorage.setItem(DRAFT_KEY, JSON.stringify(all)); }catch(e){}
}
function slotOf(name){ const b = state.build; return Object.keys(b.slots).find(s => b.slots[s] === name) || ''; }
function setSlots(slots, order){ const b = state.build; b.slots = slots; const names = Object.values(slots); b.order = (order || b.order.filter(n => names.includes(n))).filter(n => names.includes(n)); names.forEach(n => { if(!b.order.includes(n)) b.order.push(n); }); b.sel = null; saveDraft(); }
function bdPlace(name, slot){
  const b = state.build, from = slotOf(name), slots = { ...b.slots }, other = slots[slot];
  if(from) delete slots[from];
  if(other && other !== name && from) slots[from] = other;
  slots[slot] = name;
  setSlots(slots);
}
function bdRemove(slot){ const slots = { ...state.build.slots }; delete slots[slot]; setSlots(slots); }
function bdAuto(kind){
  const b = state.build, pool = poolNames(b.key, b.pool);
  if(pool.length < 2){ toast('후보가 2명 이상 있어야 해요. 위에서 “전체 팀원”으로 바꿔 보세요'); return; }
  const n = Math.min(pool.length, 10);
  let chosen, order;
  if(kind === 'random'){
    chosen = shuffle(pool).slice(0, n);
    const ss = shuffle(SLOTS), slots = {}; chosen.forEach((nm, i) => slots[i < 9 ? ss[i] : 'DH'] = nm);
    setSlots(slots, shuffle(chosen)); return;
  }
  const key = kind === 'classic' ? 'OPS' : kind;
  chosen = pool.slice().sort((a, c) => stat(c, key) - stat(a, key)).slice(0, n);
  order = chosen.slice();
  if(kind === 'classic'){
    const left = chosen.slice(), pick = (k) => { left.sort((a, c) => stat(c, k) - stat(a, k)); return left.shift(); };
    order = [pick('출루율'), pick('출루율'), pick('OPS'), pick('장타율')].filter(Boolean);
    left.sort((a, c) => stat(c, 'OPS') - stat(a, 'OPS')); order = order.concat(left);
  }
  setSlots(autoAssign(chosen), order);
}
function bdShuffleOrder(){ const b = state.build; if(b.order.length < 2) return; b.order = shuffle(b.order); b.sel = null; saveDraft(); }
function bdShufflePos(){
  const b = state.build, names = Object.values(b.slots); if(names.length < 2) return;
  const ks = Object.keys(b.slots), sh = shuffle(names), slots = {}; ks.forEach((k, i) => slots[k] = sh[i]); setSlots(slots, b.order);
}
function bdLoadReal(){
  const rows = lineupGroups().get(state.build.key);
  if(!rows || !rows.length){ toast('이 날짜에는 시트 라인업이 아직 없어요'); return; }
  const slots = {}, order = []; const sorted = rows.slice().sort((a, c) => (parseFloat(a['타순']) || 99) - (parseFloat(c['타순']) || 99));
  sorted.forEach(r => { const raw = (r['포지션'] || '').trim(), k = POS_KEY[raw.toUpperCase()] || POS_KEY[raw] || (/지명|DH|지타/i.test(raw) ? 'DH' : ''); if(r['이름']){ order.push(r['이름']); if(k && !slots[k]) slots[k] = r['이름']; } });
  setSlots(slots, order);
}
function bdText(){
  const b = state.build, g = gamesOf().find(x => keyOf(x._d) === b.key);
  const head = g ? `${CONFIG.TEAM_NAME} vs ${g['상대팀']}${(g['선후공'] || '').trim() ? ' (' + g['선후공'].trim() + ')' : ''} · ${fmtDate(g._d)} ${g['시간'] || ''}` : `${CONFIG.TEAM_NAME} 라인업`;
  const lines = b.order.map((n, i) => `${i + 1}. ${n} (${SLOT_LABEL[slotOf(n)] || '-'})`);
  const cand = poolNames(b.key, b.pool).filter(n => !slotOf(n));
  return head + '\n' + lines.join('\n') + (cand.length ? '\n후보: ' + cand.join(', ') : '');
}
function bdAsk(){
  const b = state.build;
  if(!b.order.length){ toast('먼저 라인업을 만들어 주세요'); return; }
  if(!CONFIG.ATTEND_URL){ toast('저장 주소가 설정되지 않았어요'); return; }
  state.pending = { type: 'lineup' };
  const d = parseDate(b.key);
  document.getElementById('confirmText').innerHTML = `<strong>${fmtDate(d)}</strong> 경기 라인업 <strong>${b.order.length}명</strong>을<br>시트에 저장할까요?<br><span class="muted" style="font-size:13px">같은 날짜의 기존 라인업은 바뀌어요.</span>`;
  const box = document.getElementById('confirm'); box.classList.add('on'); box.querySelector('.cancel').focus();
}
async function bdSave(){
  const b = state.build, key = b.key;
  const rows = b.order.map((n, i) => ({ order: i + 1, name: n, pos: SLOT_LABEL[slotOf(n)] || '' }));
  const body = JSON.stringify({ action: 'lineup', date: key, rows });
  toast('저장 중…', 10000);
  const verify = async () => {
    for(let i = 0; i < 4; i++){
      await new Promise(r => setTimeout(r, 2000));
      const fresh = await loadTab(CONFIG.TABS.lineup).catch(() => null);
      if(fresh && fresh.filter(r => { const d = parseDate(r['날짜']); return d && keyOf(d) === key; }).length === rows.length){ state.data.lineup = fresh; writeCache(state.data); return true; }
    }
    return false;
  };
  try{
    let ok = false;
    try{
      const res = await fetch(CONFIG.ATTEND_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body });
      const j = await res.json(); if(!j.ok) throw new Error(j.error || '저장 실패'); ok = true;
    }catch(e){
      if(!(e instanceof TypeError)) throw e;
      await fetch(CONFIG.ATTEND_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body });
      ok = await verify();
      if(!ok){ toast('저장이 확인되지 않았어요. 잠시 뒤 “라인업 보기”에서 확인해 주세요', 5000); return; }
    }
    toast('시트에 저장했어요. “라인업 보기”에서 확인하세요', 3500);
    load();
  }catch(e){ toast('저장하지 못했어요: ' + (e.message || e), 5000); }
}
async function bdCopy(){
  const t = bdText();
  try{ await navigator.clipboard.writeText(t); toast('복사했어요. 단톡방에 붙여넣기 하세요'); }
  catch(e){ const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); toast('복사했어요'); }catch(_){ toast('복사에 실패했어요'); } ta.remove(); }
}

    : `<div class="empty" style="padding:14px">배치하면 타순이 여기에 나와요.</div>`;

  return `<div class="chips" role="group" aria-label="경기 날짜">${chips}</div>

/* 끌어서 놓기: 마우스는 바로, 터치는 꾹 눌러서(스크롤과 구분) */
let drag = null, ghostEl = null;
function dragEnd(){ if(drag && drag.timer) clearTimeout(drag.timer); if(ghostEl){ ghostEl.remove(); ghostEl = null; } document.querySelectorAll('.over').forEach(e => e.classList.remove('over')); drag = null; }
function dragStart(){ if(!drag) return; drag.active = true; ghostEl = document.createElement('div'); ghostEl.className = 'ghost'; ghostEl.textContent = drag.name; document.body.appendChild(ghostEl); dragMove(drag.x, drag.y); if(navigator.vibrate) try{ navigator.vibrate(15); }catch(e){} }
function dragMove(x, y){
  if(ghostEl){ ghostEl.style.left = x + 'px'; ghostEl.style.top = y + 'px'; }
  document.querySelectorAll('.over').forEach(e => e.classList.remove('over'));
  const t = document.elementFromPoint(x, y), h = t && t.closest('[data-slot],#bd-pool'); if(h) h.classList.add('over');
}
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-drag]'); if(!el || state.luMode !== 'build') return;
  drag = { name: el.dataset.drag, from: el.dataset.from || '', sx: e.clientX, sy: e.clientY, x: e.clientX, y: e.clientY, active: false, touch: e.pointerType === 'touch', timer: null };
  if(drag.touch) drag.timer = setTimeout(dragStart, 300);
});
document.addEventListener('pointermove', e => {
  if(!drag) return; drag.x = e.clientX; drag.y = e.clientY;
  const dist = Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy);
  if(!drag.active){
    if(drag.touch){ if(dist > 10){ clearTimeout(drag.timer); drag = null; } }
    else if(dist > 6) dragStart();
    return;
  }
  dragMove(e.clientX, e.clientY);
});
document.addEventListener('touchmove', e => { if(drag && drag.active) e.preventDefault(); }, { passive: false });
document.addEventListener('pointerup', e => {
  if(!drag) return;
  if(!drag.active){ dragEnd(); return; }
  const d = drag, t = document.elementFromPoint(e.clientX, e.clientY);
  dragEnd(); window.__noClick = true; setTimeout(() => window.__noClick = false, 350);
  const slotEl = t && t.closest('[data-slot]'), pool = t && t.closest('#bd-pool');
  if(slotEl) bdPlace(d.name, slotEl.dataset.slot);
  else if(pool && d.from) bdRemove(d.from);
  rerenderKeepScroll();
});
document.addEventListener('pointercancel', () => dragEnd());
document.addEventListener('contextmenu', e => { if(e.target.closest && e.target.closest('[data-drag]')) e.preventDefault(); });

function memberStat(name){
  const b = recOf('seasonBat').find(r => r['이름'] === name), p = recOf('seasonPit').find(r => r['이름'] === name);
  const out = [];
  if(b && N(b['타수']) + N(b['타석']) > 0) out.push(`타자 <b>${fmtStat('타율', b['타율'])}</b> · ${esc(b['선수게임'])}경기 ${esc(b['타수'])}타수 ${esc(b['총안타'])}안타 · 타점 ${esc(b['타점'])} · 득점 ${esc(b['득점'])} · 도루 ${esc(b['도루'])} · OPS ${fmtStat('OPS', b['OPS'])}`);
  if(p && N(p['선수게임']) > 0) out.push(`투수 ERA <b>${fmtStat('ERA', p['ERA'])}</b> · ${esc(p['이닝'])}이닝 · ${esc(p['승'])}승 ${esc(p['패'])}패 · 삼진 ${esc(p['삼진'])}`);
  return out.length ? `<div class="mstat">${out.join('<br>')}</div>` : '';
}
function membersList(){
  const q = state.query.trim().toLowerCase();
  const list = state.data.members
    .filter(m => !q || Object.values(m).join(' ').toLowerCase().includes(q))
    .sort((a,b) => {
      const x = parseFloat(a['번호']), y = parseFloat(b['번호']);
      return (isNaN(x) ? 999 : x) - (isNaN(y) ? 999 : y);
    });
  if(!list.length) return `<div class="empty">찾는 팀원이 없어요.</div>`;
  return `<div class="count">총 ${list.length}명</div>` + list.map(m => {
    const sub = [m['포지션'], m['투타'], m['비고']].filter(Boolean).map(esc).join(' · ');
    const lead = m['사진'] && /^https?:/.test(m['사진'])
      ? `<img class="avatar" loading="lazy" src="${esc(imgUrl(m['사진']))}" alt="">`
      : `<div class="num">${esc(m['번호'])}</div>`;
    return `<div class="member">${lead}<div><div class="nm">${esc(m['이름'])}${m['사진'] && m['번호'] ? ` <span class="muted">#${esc(m['번호'])}</span>` : ''}</div>
      <div class="sub">${sub}</div>${memberStat(m['이름'])}</div></div>`;
  }).join('');
}
function viewMembers(){
  return `<input class="search" id="search" type="search" placeholder="이름·포지션 검색" value="${esc(state.query)}" autocomplete="off">
    <div id="mlist">${membersList()}</div>`;

}

  const notice = state.demo ? `<div class="notice">샘플 데이터예요. 파일 위쪽 CONFIG의 SHEET_ID에 시트 ID를 넣으면 우리 팀 시트 내용으로 바뀌어요.</div>`
    : state.offline ? `<div class="notice">최신 내용을 불러오지 못해 마지막으로 저장된 내용을 보여주고 있어요.</div>` : '';
  const body = state.tab === 'schedule' ? viewSchedule() : state.tab === 'lineup' ? viewLineup() : state.tab === 'record' ? viewRecord() : viewMembers();
  app.innerHTML = notice + body;
}

/* ---------- 이벤트 ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;
  if(act === 'tab'){ state.tab = el.dataset.tab; render(); window.scrollTo(0, 0); }
  else if(act === 'reload'){ load(); }
  else if(act.startsWith('bd-') || act === 'lu-mode'){
    if(window.__noClick) return;
    const b = state.build;
    if(act === 'lu-mode'){ state.luMode = el.dataset.mode; render(); return; }
    if(act === 'bd-key'){ state.build = null; state.build = { key: el.dataset.key, pool: 'att', slots: {}, order: [], sel: null }; const d = readDrafts()[el.dataset.key]; if(d){ state.build.slots = d.slots; state.build.order = d.order; } if(!Object.values(attendMap()[el.dataset.key] || {}).some(v => v === '참석')) state.build.pool = 'all'; }
    else if(act === 'bd-pool') b.pool = el.dataset.pool;
    else if(act === 'bd-cand') b.sel = (b.sel && b.sel.name === el.dataset.name && !b.sel.from) ? null : { name: el.dataset.name, from: '' };
    else if(act === 'bd-slot'){
      const slot = el.dataset.slot;
      if(b.sel){ if(b.sel.from === slot) b.sel = null; else bdPlace(b.sel.name, slot); }
      else if(b.slots[slot]) b.sel = { name: b.slots[slot], from: slot };
    }
    else if(act === 'bd-pull'){ if(b.sel && b.sel.from) bdRemove(b.sel.from); }
    else if(act === 'bd-auto') bdAuto(el.dataset.kind);
    else if(act === 'bd-shuf-order') bdShuffleOrder();
    else if(act === 'bd-shuf-pos') bdShufflePos();
    else if(act === 'bd-real') bdLoadReal();
    else if(act === 'bd-clear'){ setSlots({}, []); }
    else if(act === 'bd-up' || act === 'bd-down'){ const i = +el.dataset.i, j = act === 'bd-up' ? i - 1 : i + 1; if(j >= 0 && j < b.order.length){ [b.order[i], b.order[j]] = [b.order[j], b.order[i]]; saveDraft(); } }
    else if(act === 'bd-copy'){ bdCopy(); return; }
    else if(act === 'bd-save'){ bdAsk(); return; }
    rerenderKeepScroll();
  }
  else if(act === 'more'){ state.more[el.dataset.k] = !state.more[el.dataset.k]; render(); }
  else if(act === 'rec-sub'){ state.recSub = el.dataset.sub; render(); }
  else if(act === 'sort'){ state.recSort[el.dataset.kind] = el.dataset.col; render(); }
  else if(act === 'lineup-key'){ state.lineupKey = el.dataset.key; render(); }
  else if(act === 'goto-lineup'){ state.lineupKey = el.dataset.key; state.tab = 'lineup'; render(); window.scrollTo(0, 0); }
  else if(act === 'photo'){
    const box = document.getElementById('lightbox');
    box.querySelector('img').src = el.dataset.src; box.classList.add('on');
  }
  else if(act === 'close-photo'){ document.getElementById('lightbox').classList.remove('on'); }
  else if(act === 'rsvp'){ askRsvp(el.dataset.date, el.dataset.ans); }
  else if(act === 'set-me'){ setMe(el.parentElement.querySelector('input').value); }
  else if(act === 'confirm-ok'){ const p = state.pending; closeConfirm(); if(p) (p.type === 'lineup' ? bdSave() : rsvp(p.date, p.ans)); }
  else if(act === 'confirm-cancel'){ closeConfirm(); }
  else if(act === 'change-me'){ state.me = ''; try{ localStorage.removeItem(ME_KEY); }catch(e){} render(); }
});
document.getElementById('confirm').addEventListener('click', e => { if(e.target.id === 'confirm') closeConfirm(); });
document.addEventListener('toggle', e => {
  const d = e.target;
  if(!d.classList) return;
  if(d.classList.contains('roster')) d.open ? state.openAttend.add(d.dataset.key) : state.openAttend.delete(d.dataset.key);
  else if(d.classList.contains('box')) d.open ? state.openBox.add(d.dataset.key) : state.openBox.delete(d.dataset.key);
  else if(d.classList.contains('att-fold')) d.open ? state.openFold.add(d.dataset.key) : state.openFold.delete(d.dataset.key);
}, true);
document.addEventListener('input', e => {
  if(e.target.id === 'search'){ state.query = e.target.value; document.getElementById('mlist').innerHTML = membersList(); }
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ document.getElementById('lightbox').classList.remove('on'); closeConfirm(); }
  if(e.key === 'Enter' && e.target.classList && e.target.classList.contains('who-input')) setMe(e.target.value);
});
// 앱으로 돌아왔을 때 1분 이상 지났으면 자동으로 최신 내용 불러오기
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && CONFIG.SHEET_ID && Date.now() - state.lastLoad > 60000) load();
});

render();
load();
</script>
</body>
</html>
